<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup Example</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

header {
  background: #004D74;
  padding: 20px;
  color: white;
  text-align: center;
}

header ul {
  list-style: none;
  padding: 0;
}

header ul li {
  display: inline;
  margin: 0 15px;
}

header ul li a {
  text-decoration: none;
  color: white;
}

.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.popup.hidden {
  display: none;
}

.popup-content {
  background: white;
  padding: 20px;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
  text-align: center;
}

.popup-content button {
  padding: 10px 20px;
  background: #007BFF;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.popup-content button:hover {
  background: #0056b3;
}

  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="">Link 1</a></li>
        <li><a href="">Link 2</a></li>
        <li><a href="#section">Link 3</a></li>
      </ul>
    </nav>
  </header>

  <div class="popup hidden" id="popup">
    <div class="popup-content">
      <p>Você clicou em um link inválido!</p>
      <button id="closePopup">Fechar</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
  const links = document.querySelectorAll('a[href=""]');
  const popup = document.getElementById("popup");
  const closePopup = document.getElementById("closePopup");

  // Adiciona o evento de clique em links com href=""
  links.forEach(link => {
    link.addEventListener("click", event => {
      event.preventDefault(); // Previne o comportamento padrão
      popup.classList.remove("hidden"); // Mostra o popup
    });
  });

  // Fecha o popup ao clicar no botão "Fechar"
  closePopup.addEventListener("click", () => {
    popup.classList.add("hidden");
  });

  // Fecha o popup ao clicar fora da área do popup
  popup.addEventListener("click", event => {
    if (event.target === popup) {
      popup.classList.add("hidden");
    }
  });
});

  </script>
</body>
</html>
