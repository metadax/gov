<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro Interno do Servidor - 500</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      background-color: #0D0D0D;
      color: #FFFFFF;
      font-family: 'Varela Round', sans-serif;
      text-align: center;
      padding: 50px;
    }
    .error-page {
      margin: 50px auto;
    }
    .error-code {
      font-size: 120px;
      color: #5955D9;
      font-weight: 900;
    }
    .error-message {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .back-link {
      color: #10B981;
      text-decoration: none;
      font-size: 18px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-code">500</div>
    <p class="error-message">Ocorreu um erro interno no servidor.</p>
    <a href="/" class="back-link">Voltar à página inicial</a>
  </div>
</body>
</html>
